<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>King Döner – Frisch. Lecker. Königlich.</title>
  <style>
    :root {
      --primary: #5E5CE6;
      --secondary: #161832;
      --accent: #E6A35C;
      --light: #F5F5FF;
      --text: #2a2a3d;
      --muted: #6b6b8a;
      --white: #ffffff;
      --card-bg: #ffffff;
      --border: #e0e0f0;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(94,92,230,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--white);
      color: var(--text);
      line-height: 1.6;
    }

    /* ===== NAVIGATION ===== */
    nav {
      position: sticky;
      top: 0;
      z-index: 999;
      background: var(--secondary);
      box-shadow: 0 2px 16px rgba(0,0,0,0.18);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }

    .nav-logo-icon {
      width: 38px;
      height: 38px;
    }

    .nav-logo-text {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--white);
      letter-spacing: 0.02em;
    }

    .nav-logo-text span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 0.25rem;
      list-style: none;
    }

    .nav-links a {
      color: rgba(255,255,255,0.82);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.45rem 0.75rem;
      border-radius: 7px;
      transition: background 0.2s, color 0.2s;
    }

    .nav-links a:hover {
      background: rgba(94,92,230,0.22);
      color: var(--white);
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      border: none;
      background: none;
    }

    .nav-toggle span {
      display: block;
      width: 26px;
      height: 3px;
      background: var(--white);
      border-radius: 2px;
      transition: 0.3s;
    }

    @media (max-width: 768px) {
      .nav-toggle { display: flex; }
      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 64px;
        left: 0; right: 0;
        background: var(--secondary);
        padding: 1rem 1.5rem 1.5rem;
        gap: 0.15rem;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      .nav-links.open { display: flex; }
      .nav-links a { padding: 0.6rem 0.8rem; font-size: 1rem; }
    }

    /* ===== SECTIONS COMMON ===== */
    section { padding: 5rem 1.5rem; }
    .section-inner { max-width: 1200px; margin: 0 auto; }

    .section-label {
      display: inline-block;
      background: rgba(94,92,230,0.12);
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 50px;
      margin-bottom: 0.85rem;
    }

    .section-title {
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .section-sub {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 580px;
      margin-bottom: 2.5rem;
    }

    /* ===== HERO ===== */
    #hero {
      background: linear-gradient(135deg, var(--secondary) 0%, #2a2860 60%, #1a1040 100%);
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-bg-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      background-image:
        radial-gradient(circle at 20% 50%, var(--primary) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, var(--accent) 0%, transparent 40%);
    }

    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 6rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(230,163,92,0.15);
      border: 1px solid rgba(230,163,92,0.35);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      margin-bottom: 1.4rem;
    }

    .hero-title {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 1.2rem;
    }

    .hero-title span { color: var(--accent); }

    .hero-desc {
      color: rgba(255,255,255,0.72);
      font-size: 1.1rem;
      margin-bottom: 2.2rem;
      max-width: 480px;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: var(--white);
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      box-shadow: 0 4px 18px rgba(94,92,230,0.4);
    }

    .btn-primary:hover {
      background: #4a48d0;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(94,92,230,0.5);
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--white);
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      border: 2px solid rgba(255,255,255,0.35);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-outline:hover {
      border-color: var(--white);
      background: rgba(255,255,255,0.08);
    }

    .hero-image {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image img {
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      object-fit: cover;
    }

    @media (max-width: 768px) {
      .hero-inner {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 2.5rem;
      }
      .hero-btns { justify-content: center; }
      .hero-desc { margin: 0 auto 2rem; }
      .hero-image { order: -1; }
      .hero-image img { max-width: 340px; }
    }

    /* ===== ÜBER UNS ===== */
    #ueber-uns { background: var(--light); }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5rem;
      align-items: center;
    }

    .about-img {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .about-img img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }

    .about-features {
      margin-top: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .about-feature {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .about-feature-icon {
      width: 38px;
      height: 38px;
      background: var(--primary);
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .about-feature-icon svg { width: 18px; height: 18px; }

    .about-feature-text strong { display: block; color: var(--secondary); font-weight: 700; }
    .about-feature-text span { font-size: 0.92rem; color: var(--muted); }

    @media (max-width: 768px) {
      .about-grid { grid-template-columns: 1fr; gap: 2rem; }
      .about-img img { height: 260px; }
    }

    /* ===== LEISTUNGEN ===== */
    #leistungen { background: var(--white); }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
    }

    .card:hover::before { transform: scaleX(1); }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 36px rgba(94,92,230,0.15);
      border-color: rgba(94,92,230,0.3);
    }

    .card-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, rgba(94,92,230,0.12), rgba(230,163,92,0.12));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.1rem;
    }

    .card-icon svg { width: 26px; height: 26px; }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 0.55rem;
    }

    .card p { font-size: 0.93rem; color: var(--muted); line-height: 1.65; }

    /* ===== GALERIE ===== */
    #galerie { background: var(--light); }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto auto;
      gap: 1rem;
    }

    .gallery-item {
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .gallery-item:first-child {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      min-height: 200px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s, filter 0.4s;
    }

    .gallery-item:first-child img { min-height: 420px; }

    .gallery-item:hover img {
      transform: scale(1.05);
      filter: brightness(0.85);
    }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(22,24,50,0.65), transparent);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
    }

    .gallery-item:hover .gallery-overlay { opacity: 1; }

    .gallery-overlay span {
      color: var(--white);
      font-weight: 600;
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      .gallery-grid {
        grid-template-columns: 1fr 1fr;
      }
      .gallery-item:first-child {
        grid-column: 1 / 3;
        grid-row: auto;
      }
      .gallery-item:first-child img { min-height: 220px; }
    }

    /* ===== ÖFFNUNGSZEITEN ===== */
    #oeffnungszeiten { background: var(--secondary); }
    #oeffnungszeiten .section-title { color: var(--white); }
    #oeffnungszeiten .section-sub { color: rgba(255,255,255,0.6); }
    #oeffnungszeiten .section-label {
      background: rgba(230,163,92,0.18);
      color: var(--accent);
    }

    .oz-table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    table.oz-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255,255,255,0.05);
      min-width: 340px;
    }

    .oz-table thead th {
      background: var(--primary);
      color: var(--white);
      padding: 1rem 1.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
    }

    .oz-table tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.07);
      transition: background 0.2s;
    }

    .oz-table tbody tr:hover { background: rgba(255,255,255,0.06); }

    .oz-table tbody tr.today { background: rgba(94,92,230,0.18); }

    .oz-table td {
      padding: 0.9rem 1.5rem;
      color: rgba(255,255,255,0.85);
      font-size: 0.97rem;
    }

    .oz-table td:first-child { font-weight: 600; }

    .badge-open {
      display: inline-block;
      background: rgba(46,213,115,0.18);
      color: #2ed573;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.7rem;
      border-radius: 50px;
    }

    .badge-closed {
      display: inline-block;
      background: rgba(255,80,80,0.18);
      color: #ff6b6b;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.7rem;
      border-radius: 50px;
    }

    /* ===== KONTAKT ===== */
    #kontakt { background: var(--white); }

    .kontakt-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 3rem;
      align-items: start;
    }

    .kontakt-info { display: flex; flex-direction: column; gap: 1.2rem; }

    .kontakt-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.2rem;
      background: var(--light);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .kontakt-item-icon {
      width: 44px;
      height: 44px;
      background: var(--primary);
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kontakt-item-icon svg { width: 20px; height: 20px; }

    .kontakt-item-text strong {
      display: block;
      font-weight: 700;
      color: var(--secondary);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.2rem;
    }

    .kontakt-item-text span, .kontakt-item-text a {
      color: var(--muted);
      font-size: 0.97rem;
      text-decoration: none;
    }

    .kontakt-item-text a:hover { color: var(--primary); }

    .form-card {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }

    .form-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 1.4rem;
    }

    .form-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1.2rem;
      padding: 0.6rem 0.9rem;
      background: rgba(94,92,230,0.07);
      border-left: 3px solid var(--primary);
      border-radius: 4px;
    }

    .form-group { margin-bottom: 1.1rem; }

    .form-group label {
      display: block;
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.97rem;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(94,92,230,0.12);
    }

    .form-group textarea { resize: vertical; min-height: 120px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    @media (max-width: 768px) {
      .kontakt-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }

    /* ===== MAPS ===== */
    #maps { background: var(--light); padding: 3rem 1.5rem; }

    .maps-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .maps-frame {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .maps-frame iframe {
      width: 100%;
      height: 420px;
      border: none;
      display: block;
    }

    /* ===== CTA ===== */
    #cta {
      background: linear-gradient(135deg, var(--primary) 0%, #4a48d0 100%);
      padding: 5rem 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    #cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 50%, rgba(255,255,255,0.08) 0%, transparent 50%),
        radial-gradient(circle at 90% 50%, rgba(230,163,92,0.12) 0%, transparent 50%);
    }

    .cta-inner {
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .cta-inner h2 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 900;
      color: var(--white);
      margin-bottom: 1rem;
    }

    .cta-inner p {
      color: rgba(255,255,255,0.8);
      font-size: 1.08rem;
      margin-bottom: 2.2rem;
    }

    .cta-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-white {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--white);
      color: var(--primary);
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    }

    .btn-white:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.22);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--white);
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      border: 2px solid rgba(255,255,255,0.45);
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-ghost:hover {
      border-color: var(--white);
      background: rgba(255,255,255,0.1);
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--secondary);
      padding: 2.5rem 1.5rem;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-copy {
      color: rgba(255,255,255,0.5);
      font-size: 0.87rem;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      font-size: 0.87rem;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: var(--white); }

    /* ===== IMPRESSUM / DATENSCHUTZ ===== */
    #impressum, #datenschutz {
      background: var(--light);
      padding: 4rem 1.5rem;
    }

    #datenschutz { background: var(--white); }

    .legal-box {
      max-width: 800px;
      margin: 0 auto;
    }

    .legal-box h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 1rem;
    }

    .legal-placeholder {
      background: rgba(230,163,92,0.1);
      border: 2px dashed var(--accent);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .legal-placeholder p {
      color: var(--muted);
      font-size: 0.93rem;
    }

    .legal-placeholder strong { color: var(--accent); }

    .legal-box h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--secondary);
      margin: 1.4rem 0 0.5rem;
    }

    .legal-box p { color: var(--muted); font-size: 0.95rem; margin-bottom: 0.5rem; }

    /* ===== SCROLL ANKER OFFSET ===== */
    section[id], div[id] {
      scroll-margin-top: 64px;
    }
  </style>
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <nav>
    <div class="nav-inner">
      <a href="#hero" class="nav-logo" aria-label="King Döner – Startseite">
        <svg class="nav-logo-icon" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="19" cy="19" r="19" fill="#5E5CE6"/>
          <path d="M10 25h18M11 21h16M12 17h14" stroke="#E6A35C" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse cx="19" cy="13" rx="7" ry="3.5" fill="#E6A35C"/>
        </svg>
        <span class="nav-logo-text">King <span>Döner</span></span>
      </a>
      <button class="nav-toggle" aria-label="Menü öffnen" onclick="this.classList.toggle('active'); document.getElementById('navLinks').classList.toggle('open');">
